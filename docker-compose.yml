name: pulseops

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulseops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulseops
      POSTGRES_PASSWORD: pulseops
      POSTGRES_DB: pulseops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseops -d pulseops"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: pulseops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ──────────────────────────────────────────────────────────────
  # Migrations — separate step before API/worker start.
  # Production MUST use `prisma migrate deploy` (never `migrate dev`).
  # ──────────────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulseops-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pulseops:pulseops@postgres:5432/pulseops?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulseops-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: info
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql://pulseops:pulseops@postgres:5432/pulseops?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-min-32-chars-long-for-testing
      JWT_REFRESH_SECRET: dev-refresh-secret-min-32-chars-long-for-test
      PAYMENT_WEBHOOK_SECRET: dev-webhook-secret-min-32-chars-long-for-testing
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: ./storage
      LOCAL_STORAGE_URL: /storage
      FAIL_ON_DEPENDENCY_ERROR: "false"
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulseops-worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgresql://pulseops:pulseops@postgres:5432/pulseops?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-min-32-chars-long-for-testing
      JWT_REFRESH_SECRET: dev-refresh-secret-min-32-chars-long-for-testing
      PAYMENT_WEBHOOK_SECRET: dev-webhook-secret-min-32-chars-long-for-testing
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: ./storage
      LOCAL_STORAGE_URL: /storage
    command: ["node", "src/worker.js"]
    volumes:
      - ./storage:/app/storage
    # Worker has no HTTP endpoint — healthcheck checks process is alive
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[n]ode src/worker.js' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
    name: pulseops_pgdata
  redisdata:
    name: pulseops_redisdata
